name: tukenmez_gpa_run
description: "TÜKENMEZ: GPA Run — defter sayfasında 3 şeritli akademik koşu oyunu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.38.2
  flutter_riverpod: ^3.4.3
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flame_test: ^2.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
    - assets/levels/
    - assets/levels/common/
    - assets/levels/calc101/
    - assets/levels/phys101/
    - assets/levels/cs101/

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
